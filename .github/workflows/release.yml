# Builds the macOS .dmg and the Windows installer. Each is built on its own
# system because the Python engine is frozen into a native binary.
# Run it by hand from the Actions tab, or push a tag like v0.1.0.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run engine:setup
      - run: npm run engine:test
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build; see README
      - uses: actions/upload-artifact@v4
        with:
          name: quant-terminal-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
